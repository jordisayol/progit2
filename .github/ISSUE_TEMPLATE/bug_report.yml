name: Informe d'error
description: Crea un informe per ajudar-nos a millorar
labels: ["bug"]
body:
- type: checkboxes
attributes:
label: No existeix cap informe d'error igual o similar. 
description: Si us plau, cerca si ja existeix una incidència per a l'error que has trobat. 
options:
- label: He cercat entre les incidències existents
required: true

- type: checkboxes
attributes:
label: Aquest informe tracta sobre un únic error concret. 
description: Si us plau, crea una incidència per cada error; separa els informes si cal. 
options:
- label: Informo d'un únic error concret
required: true

- type: checkboxes
attributes:
label: Aquest informe tracta sobre el llibre ProGit, versió 2, en anglès. 
description: No s'accepten informes d'errors sobre traduccions o sobre la primera versió del llibre. 
options:
- label: Aquest error no té a veure amb una traducció ni amb una versió antiga
required: true

- type: checkboxes
attributes:
label: L'error afecta el lloc web o el PDF del llibre
description: Aquest error fa referència al llibre tal com apareix al [lloc web](https://www.git-scm.com/book/en/v2) o al PDF. 
options:
- label: Confirmo que l'error afecta el llibre tal com apareix al lloc web o al PDF
validations:
required: false

- type: checkboxes
attributes:
label: El problema també és present al llibre Pro Git del lloc web? 
description: Si has trobat una incidència als fitxers PDF, EPUB o MOBI, comprova si el problema també existeix al llibre Pro Git del [lloc web](https://www.git-scm.com/book/en/v2). 
options:
- label: Aquest error també afecta el llibre Pro Git publicat al lloc web. 
validations:
required: false

- type: dropdown
attributes:
label: Quina versió del llibre està afectada? 
description: | Per a nosaltres és important saber si el problema rau en el fitxer d'origen o en l'eina que genera els fitxers PDF, EPUB o MOBI. 
Per tant, seleccioneu quines versions estan afectades. 
opcions:
- "Fitxers d'origen"
- "Eina de generació"
- "Fitxers d'origen i eina de generació"
- "No ho sé"
validacions:
obligatori: true

- tipus: textarea
atributs:
etiqueta: "Descriviu l'error:"
descripció: Una descripció clara i concisa de l'error. 
validacions:
obligatori: true

- tipus: textarea
atributs:
etiqueta: "Passos per reproduir l'error:"
descripció: Escriviu aquí els passos necessaris per reproduir l'error. 
marcador_de_posició: Proporcioneu una llista ordenada de passos per reproduir-lo. 
valor: | 
1. Aneu a '...'
2. Feu clic a '...'
3. Desplaceu-vos fins a '...'
4. Observeu l'error
validacions:
obligatori: true

- tipus: textarea
atributs:
etiqueta: "Comportament esperat:"
descripció: Una descripció clara i concisa del que esperàveu que passés. 
marcador_de_posició: Esperava que passés...
validacions:
obligatori: true

- tipus: textarea
atributs:
etiqueta: "Captures de pantalla:"
descripció: Si escau, afegiu captures de pantalla per ajudar a explicar el problema. 
marcador_de_posició: "Consell: podeu arrossegar la captura de pantalla a aquest camp o copiar-la i enganxar-la." 
validacions:
obligatori: false

- tipus: textarea
atributs:
etiqueta: "Context addicional:"
descripció: | 
Afegiu aquí qualsevol altre context sobre el problema. 
També podeu incloure referències a errors similars. 
marcador_de_posició: "Exemple: aquest error també afecta les incidències núm. 1 i 2." 
validacions:
obligatori: false

- tipus: input
atributs:
etiqueta: Dispositiu
descripció: Indiqueu quin tipus de dispositiu utilitzeu per accedir al contingut. marcador de posició: dispositiu mòbil / ordinador de sobretaula / portàtil / lector de llibres electrònics
validacions:
obligatori: false

- tipus: entrada de text
atributs:
etiqueta: Sistema operatiu
descripció: Si el problema està relacionat amb el llibre o els fitxers publicats, necessitem saber quin sistema operatiu utilitzeu al vostre dispositiu. 
marcador de posició: | 
Windows 10 Home Edition
validacions:
obligatori: false

- tipus: entrada de text
atributs:
etiqueta: Navegador/aplicació + versió
descripció: Quin navegador o quina aplicació utilitzeu? També necessitem el número de versió del navegador o de l'aplicació. 
marcador de posició: | 
Google Chrome 91.0.4472.164
validacions:
obligatori: false
